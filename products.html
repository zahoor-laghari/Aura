<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Aura Cosmetics</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover our complete range of premium cosmetics. Filter by category, price, and skin concern to find your perfect products.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                        'playfair': ['Playfair Display', 'serif']
                    },
                    colors: {
                        'aura': {
                            'rose': '#e11d48',
                            'pink': '#ec4899',
                            'purple': '#8b5cf6',
                            'gold': '#f59e0b',
                            'dark': '#1f2937',
                            'light': '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter bg-gray-50 text-gray-900">
    
    <!-- Navigation (same as homepage) -->
    <nav class="fixed top-0 left-0 right-0 bg-white/95 backdrop-blur-md z-50 border-b border-gray-100 transition-all duration-300" id="navbar">
        <div class="container mx-auto px-4 lg:px-6">
            <div class="flex items-center justify-between h-16 lg:h-20">
                
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="index.html" class="font-playfair text-2xl lg:text-3xl font-bold text-aura-rose hover:text-aura-pink transition-colors duration-300">
                        Aura
                    </a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden lg:flex items-center space-x-8">
                    <a href="index.html" class="nav-link text-gray-700 hover:text-aura-rose font-medium transition-colors duration-300">Home</a>
                    <div class="relative group">
                        <a href="products.html" class="nav-link text-aura-rose font-medium transition-colors duration-300 flex items-center">
                            Products <i class="fas fa-chevron-down ml-1 text-xs"></i>
                        </a>
                    </div>
                    <a href="#" class="nav-link text-gray-700 hover:text-aura-rose font-medium transition-colors duration-300">Collections</a>
                    <a href="#" class="nav-link text-gray-700 hover:text-aura-rose font-medium transition-colors duration-300">About</a>
                    <a href="#" class="nav-link text-gray-700 hover:text-aura-rose font-medium transition-colors duration-300">Contact</a>
                </div>
                
                <!-- Search & Actions -->
                <div class="flex items-center space-x-4">
                    <!-- Search -->
                    <div class="relative hidden md:block">
                        <input type="text" 
                               placeholder="Search products..." 
                               class="w-64 pl-10 pr-4 py-2 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-aura-rose/30 focus:border-aura-rose transition-all duration-300"
                               id="searchInput">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                    
                    <!-- User Account -->
                    <button class="p-2 rounded-full hover:bg-gray-100 transition-colors duration-300" id="userBtn">
                        <i class="fas fa-user text-gray-700"></i>
                    </button>
                    
                    <!-- Wishlist -->
                    <button class="p-2 rounded-full hover:bg-gray-100 transition-colors duration-300 relative" id="wishlistBtn">
                        <i class="fas fa-heart text-gray-700"></i>
                        <span class="absolute -top-1 -right-1 bg-aura-rose text-white text-xs rounded-full w-4 h-4 flex items-center justify-center hidden" id="wishlistCount">0</span>
                    </button>
                    
                    <!-- Cart -->
                    <button class="p-2 rounded-full hover:bg-gray-100 transition-colors duration-300 relative" id="cartBtn">
                        <i class="fas fa-shopping-bag text-gray-700"></i>
                        <span class="absolute -top-1 -right-1 bg-aura-rose text-white text-xs rounded-full w-4 h-4 flex items-center justify-center" id="cartCount">0</span>
                    </button>
                    
                    <!-- Mobile Menu Toggle -->
                    <button class="lg:hidden p-2 rounded-full hover:bg-gray-100 transition-colors duration-300" id="mobileMenuBtn">
                        <i class="fas fa-bars text-gray-700"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Page Header -->
    <section class="pt-24 pb-12 bg-white">
        <div class="container mx-auto px-4 lg:px-6">
            <div class="text-center" data-aos="fade-up">
                <h1 class="font-playfair text-4xl lg:text-6xl font-bold text-gray-900 mb-4">
                    All Products
                </h1>
                <p class="text-xl text-gray-600 max-w-2xl mx-auto">
                    Discover our complete range of premium cosmetics designed to enhance your natural beauty
                </p>
            </div>
            
            <!-- Breadcrumb -->
            <nav class="flex items-center space-x-2 text-sm text-gray-500 mt-6 justify-center" data-aos="fade-up" data-aos-delay="100">
                <a href="index.html" class="hover:text-aura-rose transition-colors">Home</a>
                <i class="fas fa-chevron-right text-xs"></i>
                <span class="text-gray-900 font-medium">Products</span>
            </nav>
        </div>
    </section>
    
    <!-- Products Section -->
    <section class="py-12">
        <div class="container mx-auto px-4 lg:px-6">
            <div class="flex flex-col lg:flex-row gap-8">
                
                <!-- Filters Sidebar -->
                <div class="lg:w-80 shrink-0" data-aos="fade-right">
                    <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-24">
                        
                        <!-- Filter Header -->
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="font-semibold text-lg text-gray-900">Filters</h3>
                            <button class="text-aura-rose hover:text-aura-pink text-sm font-medium" id="clearFilters">
                                Clear All
                            </button>
                        </div>
                        
                        <!-- Category Filter -->
                        <div class="filter-group">
                            <button class="filter-header w-full text-left flex items-center justify-between" data-filter="category">
                                <span>Category</span>
                                <i class="fas fa-chevron-down transition-transform duration-200"></i>
                            </button>
                            <div class="filter-content">
                                <label class="filter-option">
                                    <input type="checkbox" name="category" value="face">
                                    <span>Face (24)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="category" value="eyes">
                                    <span>Eyes (18)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="category" value="lips">
                                    <span>Lips (16)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="category" value="skincare">
                                    <span>Skincare (12)</span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Price Filter -->
                        <div class="filter-group">
                            <button class="filter-header w-full text-left flex items-center justify-between" data-filter="price">
                                <span>Price Range</span>
                                <i class="fas fa-chevron-down transition-transform duration-200"></i>
                            </button>
                            <div class="filter-content">
                                <label class="filter-option">
                                    <input type="checkbox" name="price" value="0-25">
                                    <span>Under $25 (8)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="price" value="25-50">
                                    <span>$25 - $50 (32)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="price" value="50-75">
                                    <span>$50 - $75 (18)</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="price" value="75+">
                                    <span>$75+ (12)</span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Skin Concern Filter -->
                        <div class="filter-group">
                            <button class="filter-header w-full text-left flex items-center justify-between" data-filter="concern">
                                <span>Skin Concern</span>
                                <i class="fas fa-chevron-down transition-transform duration-200"></i>
                            </button>
                            <div class="filter-content">
                                <label class="filter-option">
                                    <input type="checkbox" name="concern" value="acne">
                                    <span>Acne-Prone</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="concern" value="sensitive">
                                    <span>Sensitive Skin</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="concern" value="aging">
                                    <span>Anti-Aging</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="concern" value="dryness">
                                    <span>Dryness</span>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="concern" value="oily">
                                    <span>Oily Skin</span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Rating Filter -->
                        <div class="filter-group">
                            <button class="filter-header w-full text-left flex items-center justify-between" data-filter="rating">
                                <span>Customer Rating</span>
                                <i class="fas fa-chevron-down transition-transform duration-200"></i>
                            </button>
                            <div class="filter-content">
                                <label class="filter-option">
                                    <input type="checkbox" name="rating" value="5">
                                    <div class="flex items-center">
                                        <div class="star-rating mr-2">
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                        </div>
                                        <span>5 Stars</span>
                                    </div>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="rating" value="4">
                                    <div class="flex items-center">
                                        <div class="star-rating mr-2">
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star text-gray-300 text-sm"></i>
                                        </div>
                                        <span>4+ Stars</span>
                                    </div>
                                </label>
                                <label class="filter-option">
                                    <input type="checkbox" name="rating" value="3">
                                    <div class="flex items-center">
                                        <div class="star-rating mr-2">
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star active text-yellow-400 text-sm"></i>
                                            <i class="fas fa-star text-gray-300 text-sm"></i>
                                            <i class="fas fa-star text-gray-300 text-sm"></i>
                                        </div>
                                        <span>3+ Stars</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Products Grid -->
                <div class="flex-1">
                    
                    <!-- Toolbar -->
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 bg-white rounded-2xl p-6 shadow-lg" data-aos="fade-up">
                        <div class="flex items-center space-x-4 mb-4 md:mb-0">
                            <!-- Mobile Filter Toggle -->
                            <button class="lg:hidden btn-secondary text-sm px-4 py-2" id="mobileFilterBtn">
                                <i class="fas fa-filter mr-2"></i>
                                Filters
                            </button>
                            
                            <!-- Results Count -->
                            <span class="text-gray-600">
                                Showing <span class="font-semibold text-gray-900" id="resultsCount">70</span> products
                            </span>
                        </div>
                        
                        <!-- Sort Options -->
                        <div class="flex items-center space-x-4">
                            <span class="text-gray-600 text-sm">Sort by:</span>
                            <select class="border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-aura-rose/30 focus:border-aura-rose" id="sortSelect">
                                <option value="featured">Featured</option>
                                <option value="newest">Newest</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Highest Rated</option>
                                <option value="popular">Most Popular</option>
                            </select>
                            
                            <!-- View Toggle -->
                            <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                                <button class="p-2 hover:bg-gray-100 transition-colors active" id="gridView">
                                    <i class="fas fa-th text-gray-600"></i>
                                </button>
                                <button class="p-2 hover:bg-gray-100 transition-colors" id="listView">
                                    <i class="fas fa-list text-gray-600"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Products Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="productsGrid">
                        <!-- Products will be dynamically loaded here -->
                    </div>
                    
                    <!-- Load More Button -->
                    <div class="text-center mt-12" data-aos="fade-up">
                        <button class="btn-secondary" id="loadMoreBtn">
                            Load More Products
                            <i class="fas fa-chevron-down ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Mobile Filter Sidebar -->
    <div class="filter-sidebar lg:hidden" id="mobileFilterSidebar">
        <div class="p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-semibold text-lg text-gray-900">Filters</h3>
                <button class="p-2 hover:bg-gray-100 rounded-full" id="closeMobileFilter">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            
            <!-- Same filter content as desktop sidebar -->
            <div class="space-y-6">
                <!-- Category Filter -->
                <div>
                    <h4 class="font-medium text-gray-900 mb-3">Category</h4>
                    <div class="space-y-3">
                        <label class="filter-option">
                            <input type="checkbox" name="mobile-category" value="face">
                            <span>Face (24)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="mobile-category" value="eyes">
                            <span>Eyes (18)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="mobile-category" value="lips">
                            <span>Lips (16)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="mobile-category" value="skincare">
                            <span>Skincare (12)</span>
                        </label>
                    </div>
                </div>
                
                <!-- Apply Filters Button -->
                <button class="btn-primary w-full" id="applyMobileFilters">
                    Apply Filters
                </button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
    
</body>
</html>
